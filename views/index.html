<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RipIt</title>
  <link rel="stylesheet" href="../style.css">
  <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
    />
</head>
<body>
    <div id="duplicates-modal-container" style="display: none;">
      <h3 style="margin: 0 0 8px; color: orange;">Doublon détecté</h3>
      <p id="duplicates-modal-msg" style="color: #555; margin: 0 0 16px; font-size: 14px;"></p>
      <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 20px; cursor: pointer;">
        <input type="checkbox" id="duplicates-modal-remember"> Faire de même pour les vidéos suivantes
      </label>
      <div style="display: flex; gap: 10px; justify-content: flex-end;">
        <button id="duplicates-modal-skip">Ignorer</button>
        <button id="duplicates-modal-download">Télécharger quand même</button>
      </div>
    </div>
    <div id="app">
      <header>
        <p class="subtitle">Convertis des vidéos youtube personnels via FFmpeg et YTdlp</p>
      </header>

      <div id="url-input-container">
        <input id="url-input" type="text" name="url" placeholder="url de la video youtube"/>        
        <button id="clear-input" class="ph ph-x-circle"></button>
      </div>
      <div id="message-container" style="display: none;">
        <p id="message" class="message error-message" >
          message        
        </p>
      </div>
      <div id="drop-area">
        <i id="drop-icon" class="ph ph-file"></i>
        <p>Glisse ton fichier .txt ici</p>
        <p>ou clique pour parcourir</p>
        <input type="file" id="txt-input" accept=".txt" style="display: none;" />
        <button onclick="document.getElementById('txt-input').click()">Choisir un fichier</button>
      </div>

      <div id="file-result" style="display: none;">
        <p id="file-name"></p>
        <p id="file-count"></p>
        <button id="clear-files-btn">Retirer</button>
      </div>

      <div id="settings">
        <div class="setting-group">
          <label for="format">Format de sortie</label>
          <select id="format">
            <option value="flac">FLAC (lossless)</option>
            <option value="mp3">MP3</option>            
            <option value="aac">AAC</option>
            <option value="ogg">OGG Vorbis</option>
          </select>
        </div>
        <div class="setting-group" id="bitrate-group">
          <label for="bitrate">Bitrate</label>
          <select id="bitrate">
            <option value="320k" selected>320 kbps</option>
            <option value="256k">256 kbps</option>
            <option value="192k">192 kbps</option>
            <option value="128k">128 kbps</option>
          </select>
        </div>
        <div class="setting-group">
          <label for="samplerate">Sample rate</label>
          <select id="samplerate">
            <option value="96000">96000 Hz (Hi-Res)</option>
            <option value="44100">44100 Hz (CD)</option>
            <option value="48000">48000 Hz</option>            
          </select>
        </div>
        <div class="setting-group">
          <label for="channels">Canaux</label>
          <select id="channels">
            <option value="2">Stéréo</option>
            <option value="1">Mono</option>
          </select>
        </div>
      </div>

      <div id="video-infos">
        <div class="empty-state">
          Les informations de la vidéo s'afficheront ici
        </div>      
      </div>

      <div id="summary" style="display:none;"></div>

      <div id="actions" style="display:none;">
        <button id="convert-btn">Télécharger la vidéo</button>
        <button id="clear-btn">Recommencer</button>        
      </div>
      <div id="progress-container" style="display:none;">      
        <div class="progress-bar-wrap" id="progress-wrap" >
          <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>          
        </div>
        <div id="progress-texts-container">
          <span id="phase-text"></span><span id="progress-text"></span>
        </div>        
      </div>
      <footer class="subtitle">
        <span>Fait par the Alkemist</span>
        <div class="coffee-btn">
          <a href="https://buymeacoffee.com/alkemist">Buy me a Coffee</a>
        </div>
      </footer>
    </div>

    <div id="streaming-tray" class="action-tray">
      <i 
        id="apple-music-btn" 
        class="ph ph-music-notes" 
        data-target="apple-music-panel"
        data-onopen="openSelection"
      ></i>
    </div>

    <div id="lists-tray" class="action-tray">
      <i 
        id="selection-btn" 
        class="ph ph-queue" 
        data-target="selection-panel"
        data-onopen="renderSelection"
      ></i>
      <i 
        id="history-btn" 
        class="ph ph-clock" 
        data-target="history"
        data-onopen="renderHistory"
      ></i>
    </div>

    <!-- displays apple music web player view -->
    <div class="side-panel" id="apple-music-panel">      
      <div class="webview-container" id="apple-music-webview-container">
        <webview 
          id="apple-music-webview" 
          src="https://music.apple.com"          
        />
      </div>
      <button class="panel-close-btn left-side"><i class="ph ph-x"></i></button>
    </div>

    <!-- displays list of songs selected from streaming provider-->
    <div class="side-panel" id="selection-panel">
      <button class="panel-close-btn"><i class="ph ph-x"></i></button>
      <div id="selection-list-container">
        <h2>Sélection</h2>
        <p class="subtitle">...à télécharger</p>
        <div id="selection-list">

        </div>
      </div>
    </div>

    <!-- display historic of videos downloaded -->   
    <div class="side-panel" id="history">    
      <button class="panel-close-btn"><i class="ph ph-x"></i></button>
      <div id="history-list-container">
        <h2>Historique</h2>
        <p class="subtitle">...des vidéos téléchargées</p>
        <div id="history-list">

        </div>
      </div>
    </div>
  <script src="../app.js"></script>
</body>
</html>
